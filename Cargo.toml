[workspace]
resolver = "2"
members = ["crates/zoom-bridge", "crates/zoom-auth", "crates/attend-engine", "crates/attend-store", "crates/zoom-companion"]
default-members = ["crates/zoom-bridge", "crates/zoom-auth", "crates/zoom-companion"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
zoom-bridge = { path = "crates/zoom-bridge" }
zoom-auth = { path = "crates/zoom-auth" }
attend-store = { path = "crates/attend-store" }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Memory",
] }

[profile.release]
debug = 1
