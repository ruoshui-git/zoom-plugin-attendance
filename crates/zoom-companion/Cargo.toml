[package]
name = "zoom-companion"
description = "Native Windows companion for Zoom Workplace via the Zoom Plugin SDK (development baseline)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "zoom-companion"
path = "src/main.rs"

[dependencies]
zoom-bridge.workspace = true
zoom-auth.workspace = true
attend-store.workspace = true
attend-engine = { path = "../attend-engine" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["clock"] }
toml.workspace = true
windows-sys.workspace = true
windows = { version = "0.61", features = ["Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
mime_guess = "2"
encoding_rs = "0.8"
rfd = { version = "0.15", default-features = false }
clap = { version = "4", features = ["derive"] }
tao = "0.30"
wry = "0.53"
png = "0.17"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
