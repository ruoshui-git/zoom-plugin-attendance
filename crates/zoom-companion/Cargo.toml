[package]
name = "zoom-companion"
description = "Native Windows companion for Zoom Workplace via the Zoom Plugin SDK (development baseline)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "zoom-companion"
path = "src/main.rs"

[dependencies]
zoom-bridge.workspace = true
zoom-auth.workspace = true
attend-store.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["clock"] }
toml.workspace = true
windows-sys.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
tao = "0.30"
wry = "0.53"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
